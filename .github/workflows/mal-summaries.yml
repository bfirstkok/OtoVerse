name: Summarize imported anime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/data/mal-summary-input.json]
permissions:
  contents: write
concurrency:
  group: mal-summaries
  cancel-in-progress: false
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Summarize imported anime in Thai
        env:
          NEWS_AI_KEY: ${{ secrets.NEWS_AI_KEY }}
        run: node scripts/summarize-mal-catalog.mjs
      - name: Save completed summaries
        run: |
          git config user.name 'OtoVerse Catalog'
          git config user.email 'catalog@users.noreply.github.com'
          git add public/mal-synopsis-th.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Summarize imported anime in Thai'
          git pull --rebase origin main
          git push origin HEAD:main
